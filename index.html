<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fully Custom URL Shortener</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --error-color: #ef4444;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            text-align: center;
            color: #1f2937;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        #error-msg {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 600;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #result-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .short-link-box {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .short-link-box a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Custom Link Generator</h2>
    
    <div class="input-group">
        <label>আপনার লম্বা লিঙ্কটি দিন</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very-long-link..." required>
    </div>

    <div class="input-group">
        <label>সম্পূর্ণ কাস্টম লিঙ্কটি লিখুন</label>
        <input type="text" id="customSlug" placeholder="যেমন: mysite.com বা funny-link">
        <div id="error-msg">দুঃখিত, এই লিঙ্কটি আগে ব্যবহার করা হয়েছে!</div>
    </div>

    <button onclick="createShortLink()">লিঙ্ক তৈরি করুন</button>

    <div id="result-section">
        <label>আপনার শর্ট লিঙ্ক তৈরি হয়েছে:</label>
        <div class="short-link-box">
            <a id="finalLink" href="#" target="_blank"></a>
        </div>
    </div>
</div>

<script>
    function createShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const customSlug = document.getElementById('customSlug').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const resultSection = document.getElementById('result-section');
        const finalLink = document.getElementById('finalLink');

        if (!longUrl || !customSlug) {
            alert("দুটি বক্সই পূরণ করুন!");
            return;
        }

        // LocalStorage থেকে ডেটা চেক করা (ডুপ্লিকেট চেক)
        let storage = JSON.parse(localStorage.getItem('shortLinks')) || {};

        if (storage[customSlug]) {
            // যদি কাস্টম লিঙ্কটি আগে থেকেই থাকে
            errorMsg.style.display = "block";
            resultSection.style.display = "none";
            return;
        }

        // এরর মেসেজ হাইড করা
        errorMsg.style.display = "none";

        // নতুন লিঙ্ক সেভ করা
        storage[customSlug] = longUrl;
        localStorage.setItem('shortLinks', JSON.stringify(storage));
        
        // রেজাল্ট জেনারেট করা
        // এখানে view.html?target= অংশটি মাস্কিং এর জন্য ব্যবহৃত হবে
        const maskLink = window.location.origin + "/view.html?target=" + customSlug;
        
        finalLink.innerText = customSlug; // ইউজার বারে যা দেখতে চায়
        finalLink.href = maskLink;
        
        resultSection.style.display = "block";
    }
</script>

</body>
</html>
